<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Video Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { dark: '#1e1e2f', darker: '#151521', primary: '#4fc3f7', secondary: '#ff7043' } } }
        }
    </script>
    <style>
        body { background-color: #151521; color: #fff; }
        .scene-card { background-color: #1e1e2f; border-left: 4px solid #4fc3f7; transition: all 0.2s; }
        .scene-card:hover { transform: translateX(5px); }
        .tab-btn.active { border-bottom: 2px solid #4fc3f7; color: #fff; font-weight: bold; }
    </style>
</head>
<body class="h-screen flex flex-col font-sans">
    <header class="bg-dark border-b border-gray-800 p-4 flex justify-between items-center">
        <div class="text-xl font-bold flex items-center gap-2">
            <span class="text-primary">▶</span> AI Video Studio
        </div>
        <div class="flex gap-4">
            <button id="btn-console" class="text-sm px-4 py-2 bg-gray-800 rounded hover:bg-gray-700">CLI Console</button>
            <button id="btn-videos" class="text-sm px-4 py-2 bg-gray-800 rounded hover:bg-gray-700">Gallery</button>
            <button id="btn-config" class="text-sm px-4 py-2 bg-gray-800 rounded hover:bg-gray-700">Settings</button>
            <button id="btn-render" class="text-sm px-4 py-2 bg-primary text-black font-bold rounded hover:bg-blue-400">Render Final</button>
        </div>
    </header>

    <div class="flex flex-1 overflow-hidden">
        <aside class="w-72 bg-dark border-r border-gray-800 p-4 flex flex-col overflow-y-auto">
            <h2 class="text-sm font-bold text-gray-400 uppercase mb-4">Projects</h2>
            <div id="file-list" class="flex flex-col gap-2 mb-8"></div>
            
            <h2 class="text-sm font-bold text-gray-400 uppercase mb-4">Assets</h2>
            <div class="mb-4">
                <input type="file" id="asset-upload" class="hidden">
                <button onclick="document.getElementById('asset-upload').click()" class="w-full py-2 border border-dashed border-gray-500 text-gray-400 hover:text-white rounded text-sm">+ Upload Image/Audio/Video/Font</button>
            </div>
            <div id="asset-list" class="flex flex-col gap-2 mb-8 text-xs text-gray-300"></div>

            <h2 class="text-sm font-bold text-gray-400 uppercase mb-4">Generate New</h2>
            <div class="flex flex-col gap-2">
                <input type="text" id="new-topic" placeholder="Topic (e.g. Rome)" class="bg-darker border border-gray-700 p-2 rounded text-sm w-full">
                <input type="text" id="new-filename" placeholder="Filename (e.g. rome.json)" class="bg-darker border border-gray-700 p-2 rounded text-sm w-full">
                <button id="btn-generate" class="bg-secondary text-black font-bold py-2 rounded text-sm hover:bg-orange-400">Generate Script & TTS</button>
            </div>
        </aside>

        <main class="flex-1 flex flex-col bg-darker overflow-hidden">
            <div class="p-4 border-b border-gray-800 flex justify-between items-center bg-dark">
                <h1 id="current-filename" class="text-lg font-bold text-gray-300">No project selected</h1>
                <div class="flex gap-2">
                    <button id="btn-preview" class="px-4 py-2 bg-blue-600 rounded hover:bg-blue-500 text-sm hidden">Preview Scene</button>
                    <button id="btn-save" class="px-4 py-2 bg-green-600 rounded hover:bg-green-500 text-sm hidden">Save Changes</button>
                </div>
            </div>

            <div class="flex-1 flex overflow-hidden hidden" id="editor-container">
                <div class="w-1/3 border-r border-gray-800 p-4 overflow-y-auto bg-dark" id="scenes-timeline"></div>
                <div class="flex-1 p-6 overflow-y-auto" id="scene-editor"></div>
            </div>
            
            <div id="empty-state" class="flex-1 flex items-center justify-center text-gray-500 flex-col">
                <svg class="w-16 h-16 mb-4 text-gray-700" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 4v16M17 4v16M3 8h4m10 0h4M3 12h18M3 16h4m10 0h4M4 20h16a1 1 0 001-1V5a1 1 0 00-1-1H4a1 1 0 00-1 1v14a1 1 0 001 1z"></path></svg>
                <p>Select or generate a project to start editing</p>
            </div>
        </main>
    </div>

    <!-- Modals -->
    <div id="preview-modal" class="fixed inset-0 bg-black bg-opacity-90 flex items-center justify-center hidden z-50">
        <div class="bg-dark p-4 rounded-lg shadow-xl border border-gray-700 relative max-w-5xl">
            <button onclick="document.getElementById('preview-modal').classList.add('hidden')" class="absolute top-2 right-2 text-white bg-red-600 rounded-full w-8 h-8 font-bold">X</button>
            <h3 class="text-xl font-bold mb-4">Scene Preview</h3>
            <img id="preview-img" src="" class="max-w-full max-h-[80vh] border border-gray-600">
        </div>
    </div>

    <div id="render-modal" class="fixed inset-0 bg-black bg-opacity-80 flex items-center justify-center hidden z-50">
        <div class="bg-dark p-6 rounded-lg shadow-xl border border-gray-700 w-96 text-center">
            <h3 class="text-xl font-bold mb-4">Rendering Video</h3>
            <p class="text-gray-400 mb-6 text-sm">The renderer has started in the background. Check the CLI Console for progress.</p>
            <div class="animate-pulse bg-primary h-2 w-full rounded mb-6"></div>
            <button onclick="document.getElementById('render-modal').classList.add('hidden')" class="px-4 py-2 bg-gray-700 rounded w-full">Close</button>
        </div>
    </div>

    <div id="console-modal" class="fixed inset-0 bg-black bg-opacity-90 flex items-center justify-center hidden z-50">
        <div class="bg-dark p-4 rounded-lg shadow-xl border border-gray-700 w-3/4 h-3/4 flex flex-col relative">
            <button onclick="document.getElementById('console-modal').classList.add('hidden')" class="absolute top-2 right-2 text-gray-400 hover:text-white">✕ Close</button>
            <h3 class="text-xl font-bold mb-4">CLI Console (Server Logs)</h3>
            <textarea id="console-output" class="w-full flex-1 bg-black text-green-400 font-mono text-xs p-4 rounded border border-gray-800" readonly></textarea>
        </div>
    </div>
    
    <div id="config-modal" class="fixed inset-0 bg-black bg-opacity-80 flex items-center justify-center hidden z-50">
        <div class="bg-dark p-6 rounded-lg shadow-xl border border-gray-700 w-[500px] flex flex-col max-h-[90vh]">
            <h3 class="text-xl font-bold mb-4">Settings</h3>
            
            <div class="flex gap-4 border-b border-gray-700 mb-4">
                <button class="tab-btn active pb-2 text-gray-400" onclick="switchTab('cfg-tab-theme')">Theme & Visuals</button>
                <button class="tab-btn pb-2 text-gray-400" onclick="switchTab('cfg-tab-ai')">AI Providers</button>
            </div>
            
            <div id="cfg-tab-theme" class="overflow-y-auto flex-1 pr-2">
                <label class="block text-sm text-gray-400 mb-1">Theme Presets</label>
                <select id="cfg-theme" class="w-full bg-darker p-2 rounded border border-gray-700 text-sm mb-4">
                    <option value="modern_dark">Modern Dark (Blue/Purple)</option>
                    <option value="cyberpunk">Cyberpunk (Pink/Yellow)</option>
                    <option value="minimalist">Minimalist Light (White/Gray)</option>
                    <option value="synthwave">Synthwave (Neon Pink/Purple)</option>
                    <option value="nature">Nature (Forest Green)</option>
                    <option value="ocean">Deep Ocean (Blue)</option>
                    <option value="sunset">Sunset (Orange/Yellow)</option>
                    <option value="hacker">Hacker (Matrix Green)</option>
                    <option value="crimson">Crimson (Blood Red/Black)</option>
                    <option value="neon_night">Neon Night (Black/Purple)</option>
                    <option value="corporate">Corporate (Clean Blue/White)</option>
                    <option value="monochrome">Monochrome (Dark Grays)</option>
                </select>

                <div class="flex gap-4 mb-4">
                    <div class="flex-1">
                        <label class="block text-xs text-gray-400 mb-1">Gradient Start</label>
                        <input type="color" id="cfg-grad-start" class="w-full bg-darker p-1 rounded border border-gray-700 h-10">
                    </div>
                    <div class="flex-1">
                        <label class="block text-xs text-gray-400 mb-1">Gradient End</label>
                        <input type="color" id="cfg-grad-end" class="w-full bg-darker p-1 rounded border border-gray-700 h-10">
                    </div>
                    <div class="flex-1">
                        <label class="block text-xs text-gray-400 mb-1">Primary Color</label>
                        <input type="color" id="cfg-primary" class="w-full bg-darker p-1 rounded border border-gray-700 h-10">
                    </div>
                </div>

                <label class="block text-sm text-gray-400 mb-1 font-bold mt-6 border-b border-gray-700 pb-1">Font Settings (TTF/OTF)</label>
                <label class="block text-xs text-gray-400 mb-1 mt-2">Regular Font</label>
                <select id="cfg-font-reg" class="w-full bg-darker p-2 rounded border border-gray-700 text-sm mb-2"></select>
                <label class="block text-xs text-gray-400 mb-1 mt-2">Custom Regular Font Path (Overrides dropdown)</label>
                <input type="text" id="cfg-font-reg-custom" placeholder="Optional custom path..." class="w-full bg-darker p-2 rounded border border-gray-700 text-sm mb-4">

                <label class="block text-xs text-gray-400 mb-1">Bold Font</label>
                <select id="cfg-font-bold" class="w-full bg-darker p-2 rounded border border-gray-700 text-sm mb-2"></select>
                <label class="block text-xs text-gray-400 mb-1 mt-2">Custom Bold Font Path (Overrides dropdown)</label>
                <input type="text" id="cfg-font-bold-custom" placeholder="Optional custom path..." class="w-full bg-darker p-2 rounded border border-gray-700 text-sm mb-4">
                
                <label class="block text-sm text-gray-400 mb-1 font-bold mt-6 border-b border-gray-700 pb-1">Audio Mixing</label>
                <label class="block text-xs text-gray-400 mb-1 mt-2">Background Music (BGM Path)</label>
                <input type="text" id="cfg-bgm" placeholder="assets/music.mp3" class="w-full bg-darker p-2 rounded border border-gray-700 text-sm mb-2">
            </div>

            <div id="cfg-tab-ai" class="overflow-y-auto flex-1 pr-2 hidden">
                <label class="block text-sm text-gray-400 mb-1">AI Provider</label>
                <select id="cfg-ai-prov" class="w-full bg-darker p-2 rounded border border-gray-700 text-sm mb-4">
                    <option value="ollama">Ollama (Local)</option>
                    <option value="openai_compat">OpenAI Compatible API</option>
                </select>

                <label class="block text-sm text-gray-400 mb-1">Model Name</label>
                <input type="text" id="cfg-ai-model" placeholder="llama3.2 or gpt-4" class="w-full bg-darker p-2 rounded border border-gray-700 text-sm mb-4">
                
                <label class="block text-sm text-gray-400 mb-1">Base URL (For OpenAI Compat)</label>
                <input type="text" id="cfg-ai-url" placeholder="https://api.openai.com/v1" class="w-full bg-darker p-2 rounded border border-gray-700 text-sm mb-4">
                
                <label class="block text-sm text-gray-400 mb-1">API Key Env Var Name</label>
                <input type="text" id="cfg-ai-keyenv" placeholder="OPENAI_API_KEY" class="w-full bg-darker p-2 rounded border border-gray-700 text-sm mb-4">
            </div>

            <div class="flex justify-end gap-2 mt-6 pt-4 border-t border-gray-700">
                <button onclick="document.getElementById('config-modal').classList.add('hidden')" class="px-4 py-2 bg-gray-700 rounded text-sm">Cancel</button>
                <button id="btn-save-config" class="px-4 py-2 bg-primary text-black font-bold rounded text-sm">Save Settings</button>
            </div>
        </div>
    </div>

    <div id="videos-modal" class="fixed inset-0 bg-black bg-opacity-90 flex flex-col items-center justify-center hidden z-50 p-10">
        <!-- Gallery HTML omitted for brevity but intact in browser -->
        <div class="w-full max-w-4xl bg-dark rounded-lg p-6 flex flex-col h-full border border-gray-700">
            <div class="flex justify-between mb-4">
                <h3 class="text-xl font-bold">Rendered Videos</h3>
                <button onclick="document.getElementById('videos-modal').classList.add('hidden')" class="text-gray-400 hover:text-white">✕ Close</button>
            </div>
            <div class="flex gap-4 flex-1 overflow-hidden">
                <div class="w-1/3 bg-darker rounded border border-gray-800 p-2 overflow-y-auto" id="video-list"></div>
                <div class="w-2/3 bg-black flex items-center justify-center rounded">
                    <video id="video-player" controls class="max-w-full max-h-full"></video>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/app.js"></script>
    <script>
        function switchTab(tabId) {
            document.getElementById('cfg-tab-theme').classList.add('hidden');
            document.getElementById('cfg-tab-ai').classList.add('hidden');
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tabId).classList.remove('hidden');
            event.target.classList.add('active');
        }
    </script>
</body>
</html>
